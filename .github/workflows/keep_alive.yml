name: Keep Streamlit App Awake

on:
  schedule:
    - cron: "24 */10 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        continue-on-error: true
        run: |
          echo "Pinging Sindh_HC..."
          curl -s -L --max-redirs 20 -o /dev/null "https://consumer-confidence-survey.streamlit.app/" || true
          echo "Ping attempt finished (redirect behavior is normal for Streamlit apps)."
